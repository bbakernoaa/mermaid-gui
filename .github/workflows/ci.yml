# Dev-only validation. Deliberately separate from the Pages workflow, which
# stays "upload the repo root to Pages" with no build step (constitution:
# client-only, no build step).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Pure-Python smoke (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run pure-Python suites
        run: python -m pytest tests/ -q

  browser:
    name: Browser contracts (Playwright + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Install Node test tooling
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the fixture pages from the shipped modules
        # The browser contracts must run against the real render/export
        # components and the resolver's own output, so the pages are generated at
        # test time rather than committed.
        run: |
          python3 tests/dump_catalog.py
          python3 tests/build_fixture.py
      - name: Run the browser suites
        # One worker: every suite drives the same local static server, and the
        # heavy fixtures (a 50 000-character diagram) are happier alone.
        run: npx playwright test --reporter=line
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
